[project]
name = "llm-sleeper-agents"
version = "0.1.0"
description = "Sleeper-agent backdoor in a small chat model: does it survive safety fine-tuning, and can probes and Integrated Gradients detect it?"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.15.0",
    "aiohttp>=3.14.5",
    "bitsandbytes>=0.45 ; sys_platform == 'linux'",
    "captum>=0.9.0",
    "datasets>=5.1.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "peft>=0.21.2",
    "requests>=2.34.2",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
]
